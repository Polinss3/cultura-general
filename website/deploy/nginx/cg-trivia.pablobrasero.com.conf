server {
    listen 80;
    server_name cg-trivia.pablobrasero.com;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    absolute_redirect off;
    root /var/www/cg-trivia/current;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

    location = /app-ads.txt { default_type text/plain; expires 1h; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }
    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
    location = /.well-known/security.txt { default_type text/plain; try_files $uri =404; }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|gif|ico|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
}
